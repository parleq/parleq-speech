<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      Source for web/public/og-image.png (1200×630 social card).
      Re-render after edits with: web/scripts/make-og-image.sh
      Needs network for Google Fonts at render time.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=block"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #fffbf5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }
      .lockup { display: flex; align-items: center; gap: 32px; }
      .bars { display: flex; align-items: center; gap: 11px; }
      .bars span { width: 19px; border-radius: 10px; background: #d97706; display: block; }
      .wordmark {
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 128px;
        letter-spacing: -0.015em;
        color: #0f172a;
        line-height: 1;
      }
      .tagline {
        margin-top: 40px;
        font-size: 42px;
        line-height: 1.35;
        color: #334155;
        max-width: 980px;
      }
      .url { margin-top: 44px; font-size: 30px; font-weight: 500; color: #d97706; }
    </style>
  </head>
  <body>
    <div class="lockup">
      <div class="bars" aria-hidden="true">
        <span style="height: 53px"></span>
        <span style="height: 96px"></span>
        <span style="height: 128px"></span>
        <span style="height: 80px"></span>
        <span style="height: 112px"></span>
      </div>
      <div class="wordmark">Parleq</div>
    </div>
    <div class="tagline">
      Local-first AI dictation for macOS. Speech recognition on-device —
      audio never leaves your Mac.
    </div>
    <div class="url">parleq.app</div>
  </body>
</html>
