<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!--
    Parleq logo, horizontal lockup.

    Left: five amber capsule bars matching the favicon's
    rhythm (varied heights, asymmetric falloff). No container
    background, so the mark sits cleanly on any surface.

    Right: "Parleq" wordmark in Fraunces, semibold, slate
    text color matching the website body text.

    Vertical alignment: the bar block's center aligns with
    the wordmark's cap-height center (around y=38 for
    Fraunces at 56pt semibold) — both elements share an
    optical center rather than each being centered
    separately in the viewBox.
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap');
    .wordmark {
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-size: 56px;
      font-weight: 600;
      font-variation-settings: 'opsz' 96;
      letter-spacing: -0.015em;
      fill: #0f172a;
    }
  </style>

  <g transform="translate(8, 8)">
    <rect x="0"  y="20" width="7" height="20" rx="3.5" fill="#d97706"/>
    <rect x="10" y="12" width="7" height="36" rx="3.5" fill="#d97706"/>
    <rect x="20" y="6"  width="7" height="48" rx="3.5" fill="#d97706"/>
    <rect x="30" y="15" width="7" height="30" rx="3.5" fill="#d97706"/>
    <rect x="40" y="9"  width="7" height="42" rx="3.5" fill="#d97706"/>
  </g>

  <text x="78" y="58" class="wordmark">Parleq</text>
</svg>
