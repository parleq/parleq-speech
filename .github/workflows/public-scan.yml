# Public-content scan for every PR and every push to main. This repo is
# public: refuse secrets (gitleaks), dictation audio/data, signing keys,
# build products, model weights, oversized blobs, and site copy promises the
# product can't keep. Same rules as the local pre-push gate
# (scripts/git-hooks/push-gate.py), minus the RoboRev check and the
# maintainer's private denylist, which only exist on the maintainer's Mac.

name: Public-content scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Run the scanner and ignore list from the BASE revision, so a change
          # can't weaken the scan it is being checked by. A change that first
          # introduces the scanner has no base copy and uses its own.
          if [ -n "$BASE" ] && git cat-file -e "$BASE:scripts/git-hooks/push-gate.py" 2>/dev/null; then
            git show "$BASE:scripts/git-hooks/push-gate.py" > "$RUNNER_TEMP/push-gate.py"
            git show "$BASE:.gitleaksignore" > "$RUNNER_TEMP/.gitleaksignore" 2>/dev/null \
              || : > "$RUNNER_TEMP/.gitleaksignore"
          else
            cp scripts/git-hooks/push-gate.py "$RUNNER_TEMP/push-gate.py"
            cp .gitleaksignore "$RUNNER_TEMP/.gitleaksignore" 2>/dev/null \
              || : > "$RUNNER_TEMP/.gitleaksignore"
          fi
          PARLEQ_GITLEAKSIGNORE="$RUNNER_TEMP/.gitleaksignore" \
            python3 "$RUNNER_TEMP/push-gate.py" --scan-range "$BASE" "$HEAD"
