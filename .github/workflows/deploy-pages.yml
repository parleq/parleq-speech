# Deploy the Astro site under web/ to GitHub Pages on every push
# to main that touches site sources, plus a manual trigger from the
# Actions tab so you can re-deploy without an empty commit.
#
# Concurrency=pages with cancel-in-progress=true means a new push
# while a deploy is mid-flight cancels the in-flight one — better
# than serializing because the latest commit is what we want live.
#
# When the repo moves to the parleq org, this file moves with it
# and keeps working — only the Astro config's `site` URL needs
# updating to match the new deployed URL.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  # No `release: types: [published]` trigger. Two reasons it's a
  # bad fit and was removed:
  #
  #   1. The `github-pages` deployment environment has a protection
  #      rule restricting deploys to ref `main`. A release-triggered
  #      run executes in the context of the release tag (e.g.
  #      `refs/tags/v0.8.1`), so the deploy step gets rejected with
  #      "Tag <vX.Y.Z> is not allowed to deploy to github-pages due
  #      to environment protection rules." That rejection is the
  #      whole reason this trigger never produced a useful run.
  #
  #   2. Even if the environment rule were relaxed, the timing races
  #      with `make release`'s explicit `gh workflow run deploy-pages.yml
  #      --ref main` dispatch: `gh release create` fires the release
  #      event ~1 second after the Makefile's dispatch, the
  #      `cancel-in-progress: true` concurrency rule below cancels
  #      the (correct) dispatch run in favor of the (broken)
  #      release-event run, and the website never updates.
  #
  # The Makefile's `gh workflow run --ref main` after `gh release create`
  # is now the sole post-release trigger. It runs as `workflow_dispatch`
  # on main, which the environment rule allows.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # Lets src/lib/release.ts authenticate against the GitHub
          # API so the latest-release fetch isn't subject to the 60-
          # req/hour unauthenticated limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
